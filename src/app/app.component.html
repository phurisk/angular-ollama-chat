
<div class="container">
  <header class="header">
    <div class="brand">
      <span class="dot"></span>
      <h1>{{ title }}</h1>
    </div>
    <div class="actions">
      <button class="ghost" (click)="clear()" title="Clear conversation">Clear</button>
    </div>
  </header>

  <div class="controls">
    <label>
      Model:
      <select [ngModel]="model()" (ngModelChange)="model.set($event)" disabled>
        <!-- ถ้าต้องการให้สลับโมเดลได้จริง แก้โค้ดให้ใช้ FormsModule และตั้งค่า model แบบ 2-way -->
        <option value="deepseek-coder-v2">deepseek-coder-v2</option>
      </select>
    </label>
  </div>

  <div class="chat-window" #chatWin (click)="onMessageClick($event)">
    <div *ngFor="let m of viewMessages()" class="msg" [class.user]="m.role==='user'" [class.assistant]="m.role==='assistant'">
      <div class="role badge">{{ formatRole(m.role) }}</div>
      <div class="bubble">
        <div class="rich" [innerHTML]="renderMessage(m.content)"></div>
      </div>
    </div>

    <div *ngIf="loading()" class="typing">
      <span class="dot dot1"></span>
      <span class="dot dot2"></span>
      <span class="dot dot3"></span>
      <span class="typing-text">Model is typing…</span>
    </div>
  </div>

  <div class="input-row">
    <textarea #composer [ngModel]="input()" (ngModelChange)="input.set($event)" (keydown)="onKeydown($event)" rows="3" placeholder="Type a message… (Enter to send, Shift+Enter for new line)" aria-label="Message input"></textarea>
    <button class="primary" (click)="send()" [disabled]="loading() || !input().trim()" aria-label="Send message">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 12L5.5 12M20 12L9 12M20 12L14 6M20 12L14 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Send</span>
    </button>
  </div>
</div>
